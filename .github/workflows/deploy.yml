name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; les pushs suivants attendent leur tour.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Tests (moteur + serveur en ligne)
        run: npm test

      - name: Build (typecheck + vite)
        run: npm run build --workspace=@barbu/web
        env:
          # Hôte du serveur temps réel Cloudflare Workers (ex. barbu.<sous-domaine>.workers.dev).
          # Défini dans Settings → Secrets and variables → Actions → Variables.
          # Absent : le mode en ligne retombe sur 127.0.0.1:8787 (dev local).
          VITE_PARTYKIT_HOST: ${{ vars.PARTYKIT_HOST }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
